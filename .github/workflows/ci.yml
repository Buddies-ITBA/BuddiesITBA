name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Uses Notion when secrets are available (pushes to main), otherwise the
      # bundled sample content — so forks and PRs still get a full build check.
      - name: Build
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EVENTS_DB: ${{ secrets.NOTION_EVENTS_DB }}
          NOTION_BLOG_DB: ${{ secrets.NOTION_BLOG_DB }}
          NOTION_TEAM_DB: ${{ secrets.NOTION_TEAM_DB }}
          NOTION_FAQ_DB: ${{ secrets.NOTION_FAQ_DB }}
