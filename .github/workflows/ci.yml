name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit + integration tests (an in-memory Postgres via PGlite, no service needed)
      - name: Test
        run: npm run test

      # Fails if src/db/schema.ts changed without running `npm run db:generate`
      - name: Migrations in sync with schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed but no migration was committed. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Build
        run: npm run build
