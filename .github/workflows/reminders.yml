name: Event reminders

# Only needed when NOT hosting on Vercel (Vercel runs the cron from vercel.json).
# Calls the reminders endpoint daily at 12:00 Buenos Aires. Needs the SITE_URL
# and CRON_SECRET repository secrets; does nothing if they're missing.
on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL/CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
