name: Migrate database

# Vercel deploys migrate automatically (`vercel-build`). Use this for other
# hosts, or to migrate by hand. Needs the DATABASE_URL repository secret.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
